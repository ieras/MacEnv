# 站点里 `include enable-php-<版本>.conf;` 引入的就是这份内容。
# 模板来源：FlyEnv static/tmpl/macOS/enable-php.conf。
# 只改了一处：socket 名换成 MacEnv 自己的，跟 PhpFpmService.socketPath() 必须逐字一致。
#
# 下面那行 socket 里的版本号占位符由 NginxService 落地时换成两位版本号（8.3 → 83），
# 按 server/php-fpm 下已有的版本目录各展开一份；本文件本身不会被拷进 nginx 配置目录。
	location ~ [^/]\.php(/|$)
	{
		## try_files $uri =404;
		fastcgi_pass  unix:/tmp/macenv-php-cgi-##VERSION##.sock;
		fastcgi_index index.php;
		include fastcgi.conf;
		include pathinfo.conf;
		fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        fastcgi_param  PATH_INFO        $fastcgi_path_info;
	}
