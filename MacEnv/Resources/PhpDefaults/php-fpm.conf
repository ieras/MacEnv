; PHP-FPM 的主 / 池配置。
;
; 注意扩展名：PHP-FPM 的配置文件永远是 .conf，没有 php-fpm.ini 这回事。
; php.ini 管的是 PHP 引擎本身（内存、扩展、上传限制…），CLI / FPM 共用同一份；
; php-fpm.conf 管的是 FPM 自己的 master / worker 池（listen、pm.*、pid、日志），
; 只有 php-fpm 会读它。两套配置，互不替代。
;
; 模板来源：FlyEnv static/tmpl/macOS/php-fpm.conf。
; 只改了两处：socket 名换成 MacEnv 自己的，并显式写 daemonize = no。
;
; 启动契约（对齐 FlyEnv src/fork/module/Php/index.ts 的 _startServer）：
;   php-fpm -p <版本 var 目录> -y <本文件> -g <版本 var/run/php-fpm.pid> -F
; -p 决定下面 pid / error_log / slowlog 这些相对路径的基准目录；
; -F（--nodaemonize）让 master 留在前台，交给 MacEnv 的 ProcessSupervisor 直接托管。
; 这里再写一条 daemonize = no，和 -F 同义，双保险，免得漏传 -F 时 master 直接 fork 跑掉。
;
; 下面 listen 里的版本号占位符由 MacEnv 落地时换成两位版本号（8.3 → 83）。
; 这个 socket 名必须和 Nginx 侧 enable-php-<版本>.conf 的 fastcgi_pass 完全一致。

[global]
pid = run/php-fpm.pid
error_log = log/php-fpm.log
log_level = notice
daemonize = no

[www]
listen = /tmp/macenv-php-cgi-##PHP-CGI-VERSION##.sock
listen.allowed_clients = 127.0.0.1

pm = dynamic
pm.max_children = 20
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 10

request_slowlog_timeout = 30
slowlog = log/php-fpm-slow.log
