; swoole-cli 运行时的 php.ini。
;
; swoole-cli 是「静态编译的 PHP 二进制发行版」（官方 README 原话），一个二进制里
; 同时带 php-cli 和 php-fpm 两个 SAPI。它跟普通 PHP 一样靠 php.ini 配置，
; 所以这个模板落地到版本目录时文件名是 php.ini（模板本身叫 swoole.ini，
; 免得跟通用 PHP 的 php.ini 混）。
;
; 模板来源：FlyEnv src/fork/module/SwooleCli/index.ts 的 runtimeIni()。
;
; 下面两个 cacert 路径由 MacEnv 在落地时替换成该版本目录下的 cacert.pem 绝对路径。
curl.cainfo="__MACENV_CACERT__"
openssl.cafile="__MACENV_CACERT__"
swoole.use_shortname=off
display_errors = On
error_reporting = E_ALL

upload_max_filesize="128M"
post_max_size="128M"
memory_limit="1G"
date.timezone="UTC"

opcache.enable=On
opcache.enable_cli=On
opcache.jit=1225
opcache.jit_buffer_size=128M

expose_php=Off
apc.enable_cli=1
