; swoole-cli 的 FPM 池配置 —— 备用能力，不是主用途。
;
; swoole-cli 日常是当 CLI 运行时用的（swoole-cli server.php 跑常驻进程），
; 跟 php-cli 一样只需要 PATH 和环境变量，不需要「服务」。它内置 php-fpm SAPI，
; 想跑 FPM 模式时用：
;   swoole-cli -P --fpm-config <本文件>
; （-P / --fpm 切 FPM，-y / --fpm-config 指定配置，见 swoole-cli 官方文档。）
;
; 模板来源：FlyEnv src/fork/module/SwooleCli/index.ts 的 runtimeFpmConf()。
; 唯一改动是 daemonize：FlyEnv 写 yes，MacEnv 写 no，因为 MacEnv 用
; ProcessSupervisor 托管前台进程，master 不能自己 fork 跑掉。
;
; pid / error_log / slowlog 是相对路径，基准目录由启动时的 -p 参数决定。
; 落地到版本目录时文件名是 php-fpm.conf。

[global]
pid = run/php-fpm.pid
error_log = log/php-fpm.log
daemonize = no

[www]
user = nobody
group = nobody

listen = 9001
;listen = run/php-fpm.sock

slowlog = log/$pool.log.slow
request_slowlog_timeout = 30s

pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
